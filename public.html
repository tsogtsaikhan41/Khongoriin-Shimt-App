<!doctype html>
<html lang="mn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#005A4C"><title>Хонгорын Шимт — Мөшгөлт</title><link rel="icon" href="./icon-192.png"><link rel="stylesheet" href="./styles.css"></head>
<body><header class="topbar"><div class="brand"><img class="logo-img" src="./logo-mark.png" alt="Хонгорын Шимт"><div class="titles"><b>Хонгорын Шимт</b><span>Бүтээгдэхүүний мөшгөлт</span></div></div></header><main id="publicApp"><div class="card"><h2 class="section-title">Уншиж байна...</h2></div></main>
<script src="./config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
(async()=>{const c=window.supabase;const cfg=window.APP_CONFIG||{};const code=new URLSearchParams(location.search).get('code');const root=document.getElementById('publicApp');if(!c||!cfg.SUPABASE_URL||cfg.SUPABASE_URL.includes('PASTE_')){root.innerHTML='<div class="card"><h2 class="section-title">Тохиргоо хийгдээгүй</h2><p>Supabase тохиргоог config.js файлд оруулна уу.</p></div>';return}if(!code){root.innerHTML='<div class="card"><h2 class="section-title">Бүтээгдэхүүний код алга</h2></div>';return}const client=c.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const r=await client.from('public_products').select('*').eq('product_code',code).maybeSingle();if(r.error||!r.data){root.innerHTML='<div class="card"><div class="warn">Бүтээгдэхүүн олдсонгүй.</div></div>';return}const x=r.data;root.innerHTML=`<div class="card"><div id="qr" style="text-align:center"></div><h2 class="section-title">${escapeHtml(x.product_type)}</h2><div class="stat-grid"><div class="stat"><div class="n">${escapeHtml(x.animal_type)}</div><div class="l">Малын төрөл</div></div><div class="stat"><div class="n">${escapeHtml(x.soum)}</div><div class="l">Сум</div></div></div><table><tr><th>Малчин</th><td>${escapeHtml(x.herder_name||'—')}</td></tr><tr><th>Нядалга</th><td>${escapeHtml(x.processing_date||'—')}</td></tr><tr><th>Савлагаа</th><td>${escapeHtml(x.packaging_date||'—')}</td></tr><tr><th>Баталгаажуулалт</th><td>${x.certified?'Тийм':'—'}</td></tr></table><p class="helper" style="margin-top:12px">Код: ${escapeHtml(x.product_code)}</p></div>`;if(window.QRCode){QRCode.toCanvas(document.createElement('canvas'),location.href,{width:180,margin:2},(err,canvas)=>{if(!err)document.getElementById('qr').appendChild(canvas)})}function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
})();
</script></body></html>
